div class="contactUs">
  <div class="overlay">
    <h1>Contact Us</h1>
    <p>Get in touch</p>

    <form class="contact-form">
      <input
        type="text"
        name="name"
        placeholder="Name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email"
        required
      >

      <textarea
        name="message"
        placeholder="Message"
        rows="5"
        required
      ></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</div>
