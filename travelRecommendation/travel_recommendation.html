<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Travel recommendation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #333;
      padding: 10px 20px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .search-container {
      display: flex;
      gap: 10px;
    }

    .search-container input {
      padding: 6px;
      font-size: 14px;
    }

    .search-container button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Content area */
    #content {
      padding: 20px;
    }

	/* About Us layout */
	.aboutUs {
	  height: calc(100vh - 60px); /* navbar height aprox */
	  background-image: url('images/background.webp');
	  background-size: cover;
	  background-position: center;
	  background-repeat: no-repeat;

	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	
	/* Contact Us layout */
	.contactUs {
	  height: calc(100vh - 60px); /* navbar height aprox */
	  background-image: url('images/background.webp');
	  background-size: cover;
	  background-position: center;
	  background-repeat: no-repeat;

	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	
	/* Home layout */
	.home {
	  height: calc(100vh - 60px); /* navbar height aprox */
	  background-image: url('images/background.webp');
	  background-size: cover;
	  background-position: center;
	  background-repeat: no-repeat;

	  display: flex;
	  align-items: center;
	  justify-content: center;
	}

	.overlay {
	  background: rgba(0, 0, 0, 0.6);
	  padding: 40px;
	  border-radius: 10px;
	  text-align: center;
	  color: white;
	  max-width: 1000px;
	}

	.social-buttons {
	  margin-top: 20px;
	  display: flex;
	  justify-content: center;
	  gap: 15px;
	  flex-wrap: wrap;
	}

	.social-buttons a {
	  text-decoration: none;
	  background-color: white;
	  color: #333;
	  padding: 10px 20px;
	  border-radius: 5px;
	  font-weight: bold;
	  transition: transform 0.2s, box-shadow 0.2s;
	}

	.social-buttons a:hover {
	  transform: scale(1.05);
	  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
	}
  </style>
</head>

<body>

  <nav class="navbar">
    <!-- Links (load content below) -->
    <div class="nav-links">
      <a href="#" onclick="loadPage('home'); return false;">Home</a>
      <a href="#" onclick="loadPage('aboutUs'); return false;">About Us</a>
      <a href="#" onclick="loadPage('contactUs'); return false;">Contact Us</a>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search...">
      <button type="button" onclick="search()">Search</button>
      <button type="button" onclick="resetSearch()">Reset</button>
    </div>
  </nav>

  <!-- Content loaded here -->
  <div id="content">
    <h1>Welcome</h1>
    <p>Select a section from the menu.</p>
  </div>

  <script>
    function search() {
      const keyword = document.getElementById("searchInput").value.trim();
      alert("Searching for: " + keyword);
    }

    function resetSearch() {
      document.getElementById("searchInput").value = "";
      alert("Search reset");
    }

    function loadPage(page) {
      fetch(`pages/${page}.html`)
        .then(response => {
          if (!response.ok) throw new Error("HTTP error " + response.status);
          return response.text();
        })
        .then(data => {
          document.getElementById('content').innerHTML = data;
        })
        .catch(() => {
          document.getElementById('content').innerHTML = "<p>Error loading page.</p>";
        });
    }

    // Optional: load Home by default
    loadPage('home');
  </script>

</body>
</html>
