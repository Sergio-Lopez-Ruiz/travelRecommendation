<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Travel recommendation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #333;
      padding: 10px 20px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .search-container {
      display: flex;
      gap: 10px;
    }

    .search-container input {
      padding: 6px;
      font-size: 14px;
    }

    .search-container button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Content area */
	#content {
	  min-height: calc(100vh - 60px);
	  background-image: url('images/background.webp');
	  background-size: cover;
	  background-position: center;
	  background-repeat: no-repeat;
	  padding: 20px;
	}	

	/* About Us layout */
	.aboutUs {
	  min-height: calc(100vh - 60px);
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	
	/* Contact Us layout */
	.contactUs {
	  min-height: calc(100vh - 60px);
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	
	/* Home layout */
	.home {
	  min-height: calc(100vh - 60px);
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}

	.overlay {
	  background: rgba(0, 0, 0, 0.6);
	  padding: 40px;
	  border-radius: 10px;
	  text-align: center;
	  color: white;
	  max-width: 1000px;
	}

	.social-buttons {
	  margin-top: 20px;
	  display: flex;
	  justify-content: center;
	  gap: 15px;
	  flex-wrap: wrap;
	}

	.social-buttons a {
	  text-decoration: none;
	  background-color: white;
	  color: #333;
	  padding: 10px 20px;
	  border-radius: 5px;
	  font-weight: bold;
	  transition: transform 0.2s, box-shadow 0.2s;
	}

	.social-buttons a:hover {
	  transform: scale(1.05);
	  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
	}
	
	#social-footer {
	  display: flex;
	  justify-content: center;
	  gap: 15px;
	  padding: 20px;
	}

	#social-footer a {
	  text-decoration: none;
	  background-color: white;
	  color: #333;
	  padding: 10px 20px;
	  border-radius: 5px;
	  font-weight: bold;
	  transition: transform 0.2s, box-shadow 0.2s;
	}

	#social-footer a:hover {
	  transform: scale(1.05);
	  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
	}
.staff {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 30px;
}

.staff-card {
  background: #f4f4f4;
  border-radius: 8px;
  padding: 20px;
  width: 200px;
  text-align: center;
}

.staff-role {
  background-color: #1e5bd8;
  color: white;
  padding: 8px;
  border-radius: 4px;
  font-weight: bold;
  margin-bottom: 10px;
}

.staff-name {
  font-size: 16px;
  font-weight: 600;
  color: black;
}

/* Contact form */
.contact-form {
  margin-top: 25px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  max-width: 420px;
}

.contact-form input,
.contact-form textarea {
  padding: 12px 14px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  font-family: Arial, sans-serif;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: #666;
}

.contact-form button {
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 6px;
  background-color: #1e5bd8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.2s;
}

.contact-form button:hover {
  background-color: #1746a8;
  transform: translateY(-1px);
}

  </style>
</head>

<body>

  <nav class="navbar">
    <!-- Links (load content below) -->
    <div class="nav-links">
      <a href="#" onclick="loadPage('home'); return false;">Home</a>
      <a href="#" onclick="loadPage('aboutUs'); return false;">About Us</a>
      <a href="#" onclick="loadPage('contactUs'); return false;">Contact Us</a>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search...">
      <button type="button" onclick="search()">Search</button>
      <button type="button" onclick="resetSearch()">Reset</button>
    </div>
  </nav>

  <!-- Content loaded here -->
  <div id="content">
    <h1>Welcome</h1>
    <p>Select a section from the menu.</p>
  </div>

	<div id="social-footer">
	  <a href="https://facebook.com" target="_blank">Facebook</a>
	  <a href="https://twitter.com" target="_blank">Twitter</a>
	  <a href="https://instagram.com" target="_blank">Instagram</a>
	  <a href="https://linkedin.com" target="_blank">LinkedIn</a>
	</div>

  <script>
    function search() {
      const keyword = document.getElementById("searchInput").value.trim();
      alert("Searching for: " + keyword);
    }

    function resetSearch() {
      document.getElementById("searchInput").value = "";
      alert("Search reset");
    }

    function loadPage(page) {
      fetch(`pages/${page}.html`)
        .then(response => {
          if (!response.ok) throw new Error("HTTP error " + response.status);
          return response.text();
        })
        .then(data => {
          document.getElementById('content').innerHTML = data;
        })
        .catch(() => {
          document.getElementById('content').innerHTML = "<p>Error loading page.</p>";
        });
    }

    // Optional: load Home by default
    loadPage('home');
  </script>

</body>
</html>
